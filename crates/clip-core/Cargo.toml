[package]
name = "clip-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["system-clipboard", "os-keychain"]
# The desktop clipboard (arboard). Mobile apps hand clips over themselves.
system-clipboard = ["dep:arboard"]
# Keep the private key in Keychain / Credential Manager / Secret Service.
os-keychain = ["dep:keyring"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
snow = "0.10"
spake2 = "0.4"
mdns-sd = "0.13"
arboard = { version = "3", optional = true }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
dirs = "5"
gethostname = "0.5"
base64 = "0.22"
png = "0.18"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
tracing = "0.1"
