[workspace]
resolver = "2"
members = ["crates/clip-core", "crates/clipd", "crates/clip-tray", "crates/clip-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
