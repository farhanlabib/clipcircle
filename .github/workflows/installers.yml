name: Installers

# Not on pull requests: bundling on macOS and Windows uses many Actions
# minutes. Run it by hand on a branch when a PR changes packaging.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            runner: windows-latest
            args: --bundles msi,nsis
            files: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          # 22.04 keeps the AppImage working on older glibc distros too.
          - name: linux
            os: ubuntu-22.04
            runner: [self-hosted, linux, x64, nas-runner, universal-clipboard-runner]
            args: --bundles deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers
      - name: Install Linux libraries for the tray app
        if: runner.os == 'Linux' && runner.name != 'nas-runner-universal-clipboard'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build the installers
        working-directory: crates/clip-tray
        run: npx --yes @tauri-apps/cli@2 build --ci ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: universal-clipboard-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
