name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, linux, x64, nas-runner, universal-clipboard-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ runner.name != 'nas-runner-universal-clipboard' }}
      - name: Install Linux libraries for the tray app
        if: runner.os == 'Linux' && runner.name != 'nas-runner-universal-clipboard'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, linux, x64, nas-runner, universal-clipboard-runner]
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ runner.name != 'nas-runner-universal-clipboard' }}
      - name: Install Linux libraries for the tray app
        if: runner.os == 'Linux' && runner.name != 'nas-runner-universal-clipboard'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo build --release
      - run: cargo test

  android:
    runs-on: [self-hosted, linux, x64, nas-runner, universal-clipboard-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ runner.name != 'nas-runner-universal-clipboard' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: cargo install cargo-ndk --locked
      # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
      - name: Build the Rust library for Android
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p clip-ffi --release
      - name: Generate Kotlin bindings
        run: >
          cargo run -p clip-ffi --features bindgen --bin uniffi-bindgen --
          generate --library target/aarch64-linux-android/release/libclip_ffi.so
          --language kotlin --out-dir android/app/src/main/java --no-format
      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: universal-clipboard-android
          path: android/app/build/outputs/apk/debug/*.apk
